name: Publish whisper helper

# Builds and publishes the tidebreak-whisper transcription helper the desktop
# app downloads on demand (see crates/tidebreak-desktop/src/whisper_install.rs).
# Each helper version is its own GitHub release, tagged whisper-helper-vX.Y.Z.
# It is a prerelease, so it can never become the latest release whose
# latest.json the desktop updater reads. Run this manually from main after
# bumping the version in crates/tidebreak-whisper: a published version is
# immutable, so a second run for the same version fails instead of swapping
# its files. Move the desktop's pinned HELPER_VERSION only after this
# workflow succeeds.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidebreak-publish-whisper-helper
  cancel-in-progress: false

jobs:
  version:
    name: resolve helper version
    # The updater key signs whatever this workflow builds, so only main's
    # source is published.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the helper crate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            --manifest-path crates/tidebreak-whisper/Cargo.toml \
            | jq -er '.packages[] | select(.name == "tidebreak-whisper") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected tidebreak-whisper version: $version" >&2
            exit 1
          }
          # Fail before the builds rather than after them.
          if gh release view "whisper-helper-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Helper $version is already published. Bump the tidebreak-whisper version instead." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build · ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          # The x86_64 Linux baseline matches the app's: Ubuntu 22.04 keeps
          # the glibc requirement no newer than the packaged desktop's.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      # whisper.cpp refuses MSVC on ARM. The cmake crate honors CMAKE_GENERATOR
      # from the environment but not CMAKE_GENERATOR_TOOLSET, so Ninja plus
      # clang-cl is the reliable way to keep aarch64-pc-windows-msvc while
      # compiling the native C/C++ with Clang.
      - name: Use clang-cl for Windows ARM native code
        if: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
        run: |
          clang_cl=""
          for candidate in \
            "$(command -v clang-cl || true)" \
            "/c/Program Files/LLVM/bin/clang-cl.exe" \
            "/c/Program Files/LLVM/bin/clang-cl"; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              clang_cl="$candidate"
              break
            fi
          done
          if [[ -z "$clang_cl" ]]; then
            echo "clang-cl is required to compile whisper.cpp on Windows ARM" >&2
            exit 1
          fi
          if ! command -v ninja >/dev/null; then
            echo "ninja is required to compile whisper.cpp on Windows ARM" >&2
            exit 1
          fi
          clang_cl="$(cygpath -m "$clang_cl")"
          {
            echo "CC=$clang_cl"
            echo "CXX=$clang_cl"
            echo "CXXFLAGS=/EHsc"
            echo "CMAKE_GENERATOR=Ninja"
            echo "CMAKE_C_COMPILER=$clang_cl"
            echo "CMAKE_CXX_COMPILER=$clang_cl"
            echo "CMAKE_ASM_COMPILER=$clang_cl"
          } >> "$GITHUB_ENV"
          echo "Using $clang_cl with Ninja for Windows ARM native code"

      - name: Build the helper
        # The helper is its own Cargo workspace; `--target-dir` keeps the artifact
        # under the repository `target/` the next step reads.
        run: >-
          cargo build --release --locked
          --manifest-path crates/tidebreak-whisper/Cargo.toml
          --target-dir target
          --target "${{ matrix.target }}"

      - name: Collect the artifact under its published name
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          extension=""
          [[ "$RELEASE_TARGET" != *windows* ]] || extension=".exe"
          built="target/$RELEASE_TARGET/release/tidebreak-whisper$extension"
          [[ -s "$built" ]] || {
            echo "Built helper is missing or empty: $built" >&2
            exit 1
          }
          mkdir -p dist
          cp "$built" "dist/tidebreak-whisper-$RELEASE_TARGET$extension"

      - name: Upload the built helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-whisper-${{ matrix.target }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: sign and publish
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/whisper-helper-v${{ needs.version.outputs.version }}
    permissions:
      contents: write
    env:
      HELPER_VERSION: ${{ needs.version.outputs.version }}
      HELPER_TAG: whisper-helper-v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate publishing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing whisper-helper publishing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Download the built helpers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tidebreak-whisper-*-${{ github.run_id }}
          merge-multiple: true
          path: dist

      - name: Require every published target
        run: |
          expected="$(printf '%s\n' \
            dist/tidebreak-whisper-aarch64-apple-darwin \
            dist/tidebreak-whisper-x86_64-apple-darwin \
            dist/tidebreak-whisper-x86_64-pc-windows-msvc.exe \
            dist/tidebreak-whisper-aarch64-pc-windows-msvc.exe \
            dist/tidebreak-whisper-x86_64-unknown-linux-gnu \
            dist/tidebreak-whisper-aarch64-unknown-linux-gnu \
            | LC_ALL=C sort)"
          actual="$(find dist -type f | LC_ALL=C sort)"
          [[ "$actual" = "$expected" ]] || {
            echo "Published helper set is incomplete or unexpected:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      # The desktop verifies the helper with the committed updater public key
      # before it can run, so these signatures are what make the download
      # trustworthy — the same authenticity bar as an app update.
      - name: Sign every helper with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          while IFS= read -r -d '' file; do
            rm -f "$file.sig"
            tauri signer sign "$file"
            [[ -s "$file.sig" ]] || {
              echo "Tauri updater signature is empty: $file.sig" >&2
              exit 1
            }
          done < <(find dist -type f ! -name '*.sig' -print0)

      # The desktop checks each helper against the updater public key before
      # it runs; a helper signed with any other key would never install.
      - name: Verify every helper signature against the updater key
        run: >-
          node scripts/verify-updater-signatures.mjs
          --config crates/tidebreak-desktop/tauri.conf.json
          dist

      # `gh release create` uploads every file before it publishes the
      # release, so nobody can download a partial helper set.
      - name: Publish the helper release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$HELPER_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Helper $HELPER_VERSION is already published. Bump the tidebreak-whisper version instead." >&2
            exit 1
          fi
          gh release create "$HELPER_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Voice helper $HELPER_VERSION" \
            --notes "The tidebreak-whisper voice transcription helper that Tidebreak downloads on demand. Each file is signed with the Tauri updater key." \
            --prerelease

      - name: Smoke test the published helpers
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$HELPER_TAG"
          while IFS= read -r -d '' file; do
            name="${file#dist/}"
            curl --fail --silent --show-error --location --head "$base/$name" >/dev/null
            curl --fail --silent --show-error --location "$base/$name.sig" \
              --output "$RUNNER_TEMP/published.sig"
            cmp "$file.sig" "$RUNNER_TEMP/published.sig"
          done < <(find dist -type f ! -name '*.sig' -print0)
