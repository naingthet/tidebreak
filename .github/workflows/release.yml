name: Publish desktop release

run-name: Publish desktop ${{ github.event.inputs.release_tag || 'current draft' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Leave blank to publish the current draft. Set a tag only to retry a draft or release created with the current artifact contract.
        required: false
        type: string
      # Windows and Linux packaging is paused: nobody is asking for newer
      # builds, and the macOS lane is the one that gates every release. The
      # jobs stay in this file; dispatch with `all` to build them again for
      # one release, or change this default to resume them for every release.
      # `macos` carries the last published Windows and Linux downloads forward
      # unchanged. v0.109.0 shipped the desktop updater's TargetNotFound
      # handling (#3462) to Windows and Linux first, so a feed without their
      # entries reads as "no update" there. A retry of a release must repeat
      # the selection its original run used; releases before v0.110.0 used
      # `all`.
      platforms:
        description: Desktop platforms to package. `macos` carries the last published Windows and Linux downloads forward unchanged.
        required: false
        type: choice
        default: macos
        options:
          - macos
          - all

permissions:
  contents: read

concurrency:
  # Serialize production builds so two tags cannot race mutable latest.json.
  group: tidebreak-desktop-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: validate release tag
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      published_at: ${{ steps.release.outputs.published_at }}
      release_id: ${{ steps.release.outputs.release_id }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate the release and freeze its source tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            drafts_json="$(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -cs \
                  '[.[][] | select(.draft == true and .prerelease == false)]'
            )"
            draft_count="$(jq -r 'length' <<<"$drafts_json")"
            if [[ "$draft_count" != 1 ]]; then
              {
                echo "Expected exactly one draft GitHub Release when release_tag is omitted; found $draft_count."
                jq -r '.[].tag_name' <<<"$drafts_json"
              } >&2
              exit 1
            fi
            RELEASE_TAG="$(jq -er '.[0].tag_name' <<<"$drafts_json")"
            echo "Using the current draft $RELEASE_TAG."
          fi

          node scripts/check-release-tag.mjs "$RELEASE_TAG"

          release_json="$(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -cs \
                --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]
                 | if length == 1 then .[0] else empty end'
          )"
          [[ -n "$release_json" ]] || {
            echo "Expected exactly one draft or published release tagged $RELEASE_TAG." >&2
            exit 1
          }
          [[ "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG" ]] || {
            echo "GitHub returned metadata for a different release tag." >&2
            exit 1
          }
          # A prerelease is an in-flight production build that was previously
          # dispatched and then failed or was re-triggered. Resume it.
          prerelease="$(jq -r .prerelease <<<"$release_json")"
          if [[ "$prerelease" = true ]]; then
            echo "Resuming an in-flight prerelease $RELEASE_TAG."
          fi

          draft="$(jq -r .draft <<<"$release_json")"
          release_id="$(jq -er .id <<<"$release_json")"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          else
            [[ "$draft" = true ]] || {
              echo "Published release $RELEASE_TAG is missing its Git tag." >&2
              exit 1
            }
            release_sha="$GITHUB_SHA"
            jq -n \
              --arg ref "refs/tags/$RELEASE_TAG" \
              --arg sha "$release_sha" \
              '{ref: $ref, sha: $sha}' | gh api \
                --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                --input - >/dev/null
          fi

          published_at="$(jq -r '.published_at // empty' <<<"$release_json")"
          if [[ "$draft" = false && "$prerelease" = false && -z "$published_at" ]]; then
            echo "Published release $RELEASE_TAG has no publication timestamp." >&2
            exit 1
          fi

          jq '{name, body, tag_name, target_commitish, prerelease}' \
            <<<"$release_json" > "$RUNNER_TEMP/release-snapshot.json"
          {
            # The release is finalized if it was mutable when validation ran.
            # Drafts and in-flight prereleases are both published by finalize.
            echo "draft=$([[ "$draft" = true || "$prerelease" = true ]] && echo true || echo false)"
            echo "published_at=$published_at"
            echo "release_id=$release_id"
            echo "sha=$release_sha"
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"
      - name: Mark the in-flight draft as a prerelease
        if: ${{ steps.release.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Keep the frozen notes on this draft, but do not publish it yet.
          # Publishing here makes GitHub treat the release as immutable, so
          # later asset uploads fail. Release Drafter only updates
          # non-prerelease drafts, so this shape freezes the notes and
          # lets the next merge start a new draft.
          # Include the frozen tag when updating draft flags; omitting it can
          # rebind a GitHub draft to an untagged placeholder.
          # Preserve the captured target metadata. The existing Git tag
          # remains the authority for the source SHA.
          release_target="$(jq -er '.target_commitish' "$RUNNER_TEMP/release-snapshot.json")"
          release_json="$(jq -n --arg tag "$RELEASE_TAG" --arg target "$release_target" \
            '{draft: true, prerelease: true} + {tag_name: $tag, target_commitish: $target}' | gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input -)"
          jq -e '.draft == true and .prerelease == true' <<<"$release_json" >/dev/null || {
            echo "Failed to keep release $RELEASE_ID as a draft after marking it in-flight." >&2
            exit 1
          }
          jq -e --arg tag "$RELEASE_TAG" --arg target "$release_target" \
            '.tag_name == $tag and .target_commitish == $target' <<<"$release_json" >/dev/null || {
            echo "GitHub changed the frozen identity of release $RELEASE_ID." >&2
            exit 1
          }
      - name: Require a commit from main
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Release tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          }
      - name: Retain the release draft snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-release-${{ steps.release.outputs.release_id }}-snapshot
          path: ${{ runner.temp }}/release-snapshot.json
          if-no-files-found: error
          retention-days: 7

  notices:
    name: third-party notices
    needs: validate
    if: ${{ needs.validate.outputs.draft == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/third-party-notices.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}

  prepare_macos:
    name: prepare unsigned macOS · ${{ matrix.target }}
    needs: [validate, notices]
    if: ${{ needs.validate.outputs.draft == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Generate this file before checking out the tag. Code from the release
      # source cannot influence the command that creates the build configuration.
      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              bundle: { targets: ["app", "dmg"] },
              // Release bundles register only the real scheme. The dev scheme
              // stays in tauri.conf.json for debug bundles, but a release
              // binary refuses tidebreak-dev:// links by design.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/tidebreak
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-cu-helper-${{ matrix.target }}
          key: macos-release-target-v5-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: macos-release-cargo-registry-v2-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/tidebreak-desktop/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --no-bundle
            --ci

      - name: Save release-specific unsigned Rust build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop
            target/${{ matrix.target }}/release/tidebreak-host-broker
            target/${{ matrix.target }}/release/tidebreak
            target/${{ matrix.target }}/release/libtidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}
            crates/tidebreak-desktop/binaries/tidebreak-cu-helper-${{ matrix.target }}
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require a successful unsigned compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared macOS inputs
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos-${{ matrix.target }}
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          cu_helper="crates/tidebreak-desktop/binaries/tidebreak-cu-helper-$RELEASE_TARGET"
          for file in "$app_binary" "$broker_sidecar" "$cli_sidecar" "$cu_helper" "$RELEASE_CONFIG"; do
            [[ -s "$file" ]] || {
              echo "Prepared macOS input is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          install -d \
            "$PREPARED_ROOT/target/$RELEASE_TARGET/release" \
            "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          install -m 755 \
            "$app_binary" \
            "$PREPARED_ROOT/$app_binary"
          install -m 755 \
            "$broker_sidecar" \
            "$PREPARED_ROOT/$broker_sidecar"
          install -m 755 \
            "$cli_sidecar" \
            "$PREPARED_ROOT/$cli_sidecar"
          install -m 755 \
            "$cu_helper" \
            "$PREPARED_ROOT/$cu_helper"
          install -m 644 \
            "$RELEASE_CONFIG" \
            "$PREPARED_ROOT/release-config.json"

          (
            cd "$PREPARED_ROOT"
            shasum -a 256 \
              release-config.json \
              "$app_binary" \
              "$broker_sidecar" \
              "$cli_sidecar" \
              "$cu_helper" \
              > SHA256SUMS
            tar -cf "$GITHUB_WORKSPACE/prepared-macos-$RELEASE_TARGET.tar" \
              SHA256SUMS \
              release-config.json \
              target \
              crates
          )
          (
            cd "$GITHUB_WORKSPACE"
            shasum -a 256 \
              "prepared-macos-$RELEASE_TARGET.tar" \
              > "prepared-macos-$RELEASE_TARGET.tar.sha256"
          )

      - name: Upload prepared macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-macos-${{ matrix.target }}-${{ github.run_id }}
          path: |
            prepared-macos-${{ matrix.target }}.tar
            prepared-macos-${{ matrix.target }}.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  combine_macos:
    name: combine unsigned macOS · universal
    needs: [validate, prepare_macos]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.prepare_macos.result == 'success'
      }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download prepared aarch64 macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-aarch64-apple-darwin-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-aarch64-apple-darwin-download

      - name: Download prepared x86_64 macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-x86_64-apple-darwin-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-x86_64-apple-darwin-download

      - name: Verify and combine prepared macOS slices
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos-universal
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            download="$RUNNER_TEMP/prepared-macos-$target-download"
            slice_root="$RUNNER_TEMP/tidebreak-prepared-macos-$target"
            (
              cd "$download"
              shasum -a 256 --check "prepared-macos-$target.tar.sha256"
            )
            rm -rf "$slice_root"
            install -d "$slice_root"
            tar -xf "$download/prepared-macos-$target.tar" -C "$slice_root"
            (
              cd "$slice_root"
              shasum -a 256 --check SHA256SUMS
              expected_files="$(printf '%s\n' \
                "./SHA256SUMS" \
                "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$target" \
                "./crates/tidebreak-desktop/binaries/tidebreak-$target" \
                "./crates/tidebreak-desktop/binaries/tidebreak-cu-helper-$target" \
                "./release-config.json" \
                "./target/$target/release/tidebreak-desktop" \
                | LC_ALL=C sort)"
              actual_files="$(find . -type f -print | LC_ALL=C sort)"
              [[ "$actual_files" = "$expected_files" ]] || {
                echo "Prepared $target archive contains an unexpected file set" >&2
                printf '%s\n' "$actual_files" >&2
                exit 1
              }
            )
          done

          arm_root="$RUNNER_TEMP/tidebreak-prepared-macos-aarch64-apple-darwin"
          x86_root="$RUNNER_TEMP/tidebreak-prepared-macos-x86_64-apple-darwin"
          cmp "$arm_root/release-config.json" "$x86_root/release-config.json"

          app_binary="target/universal-apple-darwin/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-universal-apple-darwin"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-universal-apple-darwin"
          cu_helper="crates/tidebreak-desktop/binaries/tidebreak-cu-helper-universal-apple-darwin"
          rm -rf "$PREPARED_ROOT"
          install -d \
            "$PREPARED_ROOT/target/universal-apple-darwin/release" \
            "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          install -m 644 "$arm_root/release-config.json" "$PREPARED_ROOT/release-config.json"

          lipo -create \
            "$arm_root/target/aarch64-apple-darwin/release/tidebreak-desktop" \
            "$x86_root/target/x86_64-apple-darwin/release/tidebreak-desktop" \
            -output "$PREPARED_ROOT/$app_binary"
          lipo -create \
            "$arm_root/crates/tidebreak-desktop/binaries/tidebreak-host-broker-aarch64-apple-darwin" \
            "$x86_root/crates/tidebreak-desktop/binaries/tidebreak-host-broker-x86_64-apple-darwin" \
            -output "$PREPARED_ROOT/$broker_sidecar"
          lipo -create \
            "$arm_root/crates/tidebreak-desktop/binaries/tidebreak-aarch64-apple-darwin" \
            "$x86_root/crates/tidebreak-desktop/binaries/tidebreak-x86_64-apple-darwin" \
            -output "$PREPARED_ROOT/$cli_sidecar"
          lipo -create \
            "$arm_root/crates/tidebreak-desktop/binaries/tidebreak-cu-helper-aarch64-apple-darwin" \
            "$x86_root/crates/tidebreak-desktop/binaries/tidebreak-cu-helper-x86_64-apple-darwin" \
            -output "$PREPARED_ROOT/$cu_helper"
          chmod 755 \
            "$PREPARED_ROOT/$app_binary" \
            "$PREPARED_ROOT/$broker_sidecar" \
            "$PREPARED_ROOT/$cli_sidecar" \
            "$PREPARED_ROOT/$cu_helper"

          for file in "$app_binary" "$broker_sidecar" "$cli_sidecar" "$cu_helper"; do
            arches="$(lipo -archs "$PREPARED_ROOT/$file")"
            [[ "$arches" = *arm64* && "$arches" = *x86_64* ]] || {
              echo "Combined macOS input is not universal: $file ($arches)" >&2
              exit 1
            }
          done

          (
            cd "$PREPARED_ROOT"
            shasum -a 256 \
              release-config.json \
              "$app_binary" \
              "$broker_sidecar" \
              "$cli_sidecar" \
              "$cu_helper" \
              > SHA256SUMS
            tar -cf "$GITHUB_WORKSPACE/prepared-macos.tar" \
              SHA256SUMS \
              release-config.json \
              target \
              crates
          )
          shasum -a 256 prepared-macos.tar > prepared-macos.tar.sha256

      - name: Upload prepared universal macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-macos-universal-${{ github.run_id }}
          path: |
            prepared-macos.tar
            prepared-macos.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_macos:
    name: macOS · universal
    needs: [validate, notices, combine_macos]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.notices.result == 'success'
        && needs.combine_macos.result == 'success'
      }}
    runs-on: macos-latest
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    outputs:
      signing: ${{ steps.signing.outputs.mode }}
    # The Apple values stay step-scoped. Tauri's bundler reads
    # APPLE_SIGNING_IDENTITY from the environment even when it is empty, and an
    # empty value there would override the ad-hoc identity in the build
    # configuration.
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download prepared macOS inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-macos-universal-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-macos-download

      - name: Verify prepared macOS inputs
        env:
          PREPARED_DOWNLOAD: ${{ runner.temp }}/prepared-macos-download
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-macos
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: universal-apple-darwin
        run: |
          (
            cd "$PREPARED_DOWNLOAD"
            shasum -a 256 --check prepared-macos.tar.sha256
          )
          rm -rf "$PREPARED_ROOT"
          install -d "$PREPARED_ROOT"
          tar -xf "$PREPARED_DOWNLOAD/prepared-macos.tar" -C "$PREPARED_ROOT"
          (
            cd "$PREPARED_ROOT"
            shasum -a 256 --check SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET" \
              "./crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET" \
              "./crates/tidebreak-desktop/binaries/tidebreak-cu-helper-$RELEASE_TARGET" \
              "./release-config.json" \
              "./target/$RELEASE_TARGET/release/tidebreak-desktop" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared macOS archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )

          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          cu_helper="crates/tidebreak-desktop/binaries/tidebreak-cu-helper-$RELEASE_TARGET"
          cu_resource="crates/tidebreak-desktop/resources/host-broker/tidebreak-cu-helper"
          install -d \
            "$(dirname "$app_binary")" \
            "$(dirname "$broker_sidecar")" \
            "$(dirname "$cu_resource")"
          install -m 755 "$PREPARED_ROOT/$app_binary" "$app_binary"
          install -m 755 "$PREPARED_ROOT/$broker_sidecar" "$broker_sidecar"
          install -m 755 "$PREPARED_ROOT/$cli_sidecar" "$cli_sidecar"
          install -m 755 "$PREPARED_ROOT/$cu_helper" "$cu_helper"
          install -m 755 "$PREPARED_ROOT/$cu_helper" "$cu_resource"
          install -m 644 "$PREPARED_ROOT/release-config.json" "$RELEASE_CONFIG"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate production signing configuration
        id: signing
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing updater signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          # Apple signing is optional. With every Apple value the app is signed
          # with the Developer ID certificate and notarized. With none of them
          # it is ad-hoc signed and not notarized, and the release notes say
          # so. A partial set is a misconfiguration, never a quiet fallback.
          present=()
          absent=()
          for name in \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY; do
            if [[ -n "${!name:-}" ]]; then
              present+=("$name")
            else
              absent+=("$name")
            fi
          done
          if (( ${#absent[@]} == 0 )); then
            echo "Signing with the Developer ID certificate and notarizing."
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          elif (( ${#present[@]} == 0 )); then
            echo "::warning::No Apple signing configuration. This macOS build is ad-hoc signed and not notarized."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          else
            printf 'Incomplete Apple signing configuration; missing: %s\n' "${absent[*]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        if: ${{ steps.signing.outputs.mode == 'developer-id' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/tidebreak-signing.p12"
          keychain_path="$RUNNER_TEMP/tidebreak-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            existing_keychains+=("${existing_keychain//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s \
            "$keychain_path" \
            "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY"

          {
            echo "APPLE_CERTIFICATE_PATH=$certificate_path"
            echo "APPLE_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Sign the computer-use helper resource
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          cu_resource="crates/tidebreak-desktop/resources/host-broker/tidebreak-cu-helper"
          [[ -x "$cu_resource" ]] || {
            echo "Prepared computer-use helper is missing or not executable: $cu_resource" >&2
            exit 1
          }
          if [[ "$SIGNING_MODE" = developer-id ]]; then
            codesign --force --options runtime --timestamp \
              --identifier io.brightwave.tidebreak.cu-helper \
              --sign "$APPLE_SIGNING_IDENTITY" \
              --keychain "$APPLE_SIGNING_KEYCHAIN" \
              "$cu_resource"
          else
            codesign --force --options runtime --timestamp=none \
              --identifier io.brightwave.tidebreak.cu-helper \
              --sign - \
              "$cu_resource"
          fi
          codesign --verify --strict --verbose=2 "$cu_resource"

      - name: Add the macOS signing identity to the prepared configuration
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          PREPARED_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-signing.json
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.PREPARED_CONFIG, "utf8"));
            if (config.version !== process.env.TIDEBREAK_VERSION) {
              throw new Error("Prepared version " + config.version + " does not match " + process.env.TIDEBREAK_VERSION);
            }
            // "-" makes the bundler sign the app ad-hoc. It leaves the DMG
            // unsigned.
            const identity = process.env.SIGNING_MODE === "developer-id"
              ? process.env.APPLE_SIGNING_IDENTITY
              : "-";
            config.bundle.macOS = {
              ...(config.bundle.macOS ?? {}),
              signingIdentity: identity
            };
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify(config));
          '

      # The App Store Connect key is deliberately not in the environment yet:
      # without notary credentials, Tauri signs the app and DMG but skips its
      # own notarization submission. One submission of the DMG below covers
      # the nested app too, halving the Apple round trips.
      - name: Bundle and sign the prepared Tauri app
        working-directory: crates/tidebreak-desktop
        run: |
          tauri bundle \
            --target universal-apple-darwin \
            --config "$RUNNER_TEMP/tidebreak-signing.json" \
            --bundles app,dmg \
            --ci

      - name: Prepare App Store Connect key
        if: ${{ steps.signing.outputs.mode == 'developer-id' }}
        env:
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Notarizing the DMG registers tickets for the DMG and the identically
      # signed app inside it, so both staples come from this one submission.
      - name: Notarize the DMG, then staple the DMG and app
        if: ${{ steps.signing.outputs.mode == 'developer-id' }}
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          RELEASE_TARGET: universal-apple-darwin
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          dmg_paths=("$target_dir/$RELEASE_TARGET/release/bundle/dmg/"*.dmg)
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG to notarize for $RELEASE_TARGET" >&2
            exit 1
          }
          dmg_path="${dmg_paths[0]}"
          app_paths=("$target_dir/$RELEASE_TARGET/release/bundle/macos/"*.app)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one app bundle to staple for $RELEASE_TARGET" >&2
            exit 1
          }
          app_path="${app_paths[0]}"

          submission_output="$(xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json)"
          printf '%s\n' "$submission_output"
          submission_id="$(jq -er .id <<<"$submission_output")"
          submission_status="$(jq -er .status <<<"$submission_output")"
          if [[ "$submission_status" != Accepted ]]; then
            echo "DMG notarization failed with status: $submission_status" >&2
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              || true
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"

      - name: Verify and collect signed artifacts
        env:
          RELEASE_ARCH: universal
          RELEASE_TARGET: universal-apple-darwin
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          app_paths=("$bundle_dir"/macos/*.app)
          dmg_paths=("$bundle_dir"/dmg/*.dmg)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one macOS app bundle in $bundle_dir/macos" >&2
            exit 1
          }
          (( ${#dmg_paths[@]} == 1 )) && [[ -f "${dmg_paths[0]}" ]] || {
            echo "Expected exactly one DMG in $bundle_dir/dmg" >&2
            exit 1
          }
          app_path="${app_paths[0]}"
          dmg_path="${dmg_paths[0]}"

          for file in "$app_path" "$dmg_path"; do
            [[ -e "$file" ]] || {
              echo "Required macOS release artifact is missing: ${file:-<empty path>}" >&2
              exit 1
            }
          done

          # Every macOS artifact below is derived from this app bundle — the
          # DMG, the zip, and the updater archive — so checking the bundled
          # legal notices once covers all of them. The bytes must equal the
          # checked-in files, not merely exist: a resource mapping that
          # silently stopped resolving would otherwise ship an app whose
          # notices are empty or stale.
          for legal_pair in \
            legal/THIRD-PARTY-NOTICES.md:legal/THIRD-PARTY-NOTICES.md \
            LICENSE:legal/LICENSE \
            NOTICE:legal/NOTICE; do
            source_file="${legal_pair%%:*}"
            bundled_path="${legal_pair##*:}"
            bundled="$app_path/Contents/Resources/$bundled_path"
            [[ -s "$bundled" ]] || {
              echo "Signed app is missing bundled $bundled_path" >&2
              exit 1
            }
            cmp "$source_file" "$bundled"
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"
          # An ad-hoc app passes none of Gatekeeper's checks, and the bundler
          # leaves its DMG unsigned, so only a notarized build is assessed.
          if [[ "$SIGNING_MODE" = developer-id ]]; then
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
            codesign --verify --verbose=2 "$dmg_path"
            xcrun stapler validate "$dmg_path"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          fi

          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_arches="$(lipo -archs "$app_path/Contents/MacOS/$executable")"
          case "$RELEASE_ARCH" in
            universal) [[ "$binary_arches" = *arm64* && "$binary_arches" = *x86_64* ]] ;;
            *) echo "Unsupported release architecture: $RELEASE_ARCH" >&2; exit 1 ;;
          esac || {
            echo "Expected $RELEASE_ARCH app, found Mach-O architectures: $binary_arches" >&2
            exit 1
          }

          sidecar="$app_path/Contents/MacOS/tidebreak-host-broker"
          [[ -x "$sidecar" ]] || {
            echo "Universal app is missing its executable host broker sidecar: $sidecar" >&2
            exit 1
          }
          sidecar_arches="$(lipo -archs "$sidecar")"
          [[ "$sidecar_arches" = *arm64* && "$sidecar_arches" = *x86_64* ]] || {
            echo "Expected universal host broker, found Mach-O architectures: $sidecar_arches" >&2
            exit 1
          }

          cli_sidecar="$app_path/Contents/MacOS/tidebreak"
          [[ -x "$cli_sidecar" ]] || {
            echo "Universal app is missing its executable CLI sidecar: $cli_sidecar" >&2
            exit 1
          }
          cli_arches="$(lipo -archs "$cli_sidecar")"
          [[ "$cli_arches" = *arm64* && "$cli_arches" = *x86_64* ]] || {
            echo "Expected universal CLI, found Mach-O architectures: $cli_arches" >&2
            exit 1
          }

          cu_helper="$app_path/Contents/Resources/host-broker/tidebreak-cu-helper"
          [[ -x "$cu_helper" ]] || {
            echo "Universal app is missing its executable computer-use helper: $cu_helper" >&2
            exit 1
          }
          helper_arches="$(lipo -archs "$cu_helper")"
          [[ "$helper_arches" = *arm64* && "$helper_arches" = *x86_64* ]] || {
            echo "Expected universal computer-use helper, found Mach-O architectures: $helper_arches" >&2
            exit 1
          }
          codesign --verify --strict --verbose=2 "$cu_helper"
          helper_signature="$(codesign --display --verbose=4 "$cu_helper" 2>&1)"
          app_signature="$(codesign --display --verbose=4 "$app_path" 2>&1)"
          helper_identifier="$(printf '%s\n' "$helper_signature" | sed -n 's/^Identifier=//p')"
          helper_team="$(printf '%s\n' "$helper_signature" | sed -n 's/^TeamIdentifier=//p')"
          app_team="$(printf '%s\n' "$app_signature" | sed -n 's/^TeamIdentifier=//p')"
          [[ "$helper_identifier" = io.brightwave.tidebreak.cu-helper ]] || {
            echo "Computer-use helper has an unexpected signing identifier: $helper_identifier" >&2
            exit 1
          }
          if [[ "$SIGNING_MODE" = developer-id ]]; then
            [[ -n "$app_team" && "$app_team" != "not set" && "$helper_team" = "$app_team" ]] || {
              echo "Computer-use helper signing team does not match the app: $helper_team / $app_team" >&2
              exit 1
            }
          elif ! grep -qx 'Signature=adhoc' <<<"$helper_signature" \
            || ! grep -qx 'Signature=adhoc' <<<"$app_signature"; then
            echo "An ad-hoc release must sign the app and the computer-use helper ad-hoc." >&2
            exit 1
          fi

          # Recreate the updater after notarization so the archive contains the
          # stapled app, then sign those exact bytes for latest.json.
          updater_path="${app_path}.tar.gz"
          signature_path="${updater_path}.sig"
          rm -f "$updater_path" "$signature_path"
          tar -czf "$updater_path" -C "$(dirname "$app_path")" "$(basename "$app_path")"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="$GITHUB_WORKSPACE/dist/macos/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$dmg_path" "$output_dir/${base_name}.dmg"
          cp "$updater_path" "$output_dir/${base_name}.app.tar.gz"
          cp "$signature_path" "$output_dir/${base_name}.app.tar.gz.sig"
          ditto -c -k --keepParent "$app_path" "$output_dir/${base_name}.app.zip"
          find "$output_dir" -type f -print

      - name: Smoke-test packaged GitHub CLI discovery
        env:
          RELEASE_TARGET: universal-apple-darwin
        run: |
          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          app_paths=("$target_dir/$RELEASE_TARGET/release/bundle/macos/"*.app)
          (( ${#app_paths[@]} == 1 )) && [[ -d "${app_paths[0]}" ]] || {
            echo "Expected exactly one packaged macOS app to smoke-test." >&2
            exit 1
          }
          scripts/smoke-packaged-gh-discovery.sh "${app_paths[0]}"

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-macos-universal-${{ needs.validate.outputs.version }}
          path: dist/macos/universal/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          [[ -z "${APPLE_API_KEY_PATH:-}" ]] || rm -f "$APPLE_API_KEY_PATH"
          [[ -z "${APPLE_SIGNING_KEYCHAIN:-}" ]] \
            || security delete-keychain "$APPLE_SIGNING_KEYCHAIN" \
            || true
          [[ -z "${APPLE_CERTIFICATE_PATH:-}" ]] \
            || rm -f "$APPLE_CERTIFICATE_PATH"

  prepare_windows:
    name: prepare unsigned Windows sidecars · ${{ matrix.arch }}
    needs: [validate, notices]
    if: >-
      ${{
        inputs.platforms == 'all'
        && needs.validate.outputs.draft == 'true'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned sidecar build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe
          key: windows-release-sidecars-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      # The release version is a compile-time input. Rebuild every shipped
      # product even when an exact retry restores this release's cache.
      - name: Discard restored sidecar product binaries
        run: |
          rm -rf \
            target/${{ matrix.target }}/release/tidebreak-desktop.exe \
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe \
            target/${{ matrix.target }}/release/tidebreak.exe \
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.* \
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe \
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          # This credential-free prerequisite can populate the registry cache.
          # A duplicate save against an existing key is skipped harmlessly.
          save-if: true

      - name: Compile sidecars without production credentials
        id: compile
        continue-on-error: true
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: node crates/tidebreak-desktop/scripts/prepare-sidecar.mjs --release

      - name: Save release-specific unsigned sidecar build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak-host-broker.exe
            target/${{ matrix.target }}/release/tidebreak.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
            crates/tidebreak-desktop/binaries/tidebreak-host-broker-${{ matrix.target }}.exe
            crates/tidebreak-desktop/binaries/tidebreak-${{ matrix.target }}.exe
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require successful sidecar compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared Windows sidecars
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-sidecars
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          # GNU tar treats C:\path as a remote host and \ as escapes. Stay on
          # POSIX paths for every tar argument.
          PREPARED_ROOT="$(cygpath -u "$PREPARED_ROOT")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          for file in "$broker_sidecar" "$cli_sidecar"; do
            [[ -s "$file" ]] || {
              echo "Prepared Windows sidecar is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          mkdir -p "$PREPARED_ROOT/crates/tidebreak-desktop/binaries"
          cp -p "$broker_sidecar" "$PREPARED_ROOT/$broker_sidecar"
          cp -p "$cli_sidecar" "$PREPARED_ROOT/$cli_sidecar"

          (
            cd "$PREPARED_ROOT"
            sha256sum \
              "$broker_sidecar" \
              "$cli_sidecar" \
              > SHA256SUMS
          )
          (
            cd "$workspace"
            tar -cf prepared-windows-sidecars.tar -C "$PREPARED_ROOT" \
              SHA256SUMS \
              crates
            sha256sum prepared-windows-sidecars.tar \
              > prepared-windows-sidecars.tar.sha256
          )

      - name: Upload prepared Windows sidecars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-windows-sidecars-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            prepared-windows-sidecars.tar
            prepared-windows-sidecars.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  prepare_windows_desktop:
    name: prepare unsigned Windows desktop · ${{ matrix.arch }}
    needs: [validate, notices]
    if: >-
      ${{
        inputs.platforms == 'all'
        && needs.validate.outputs.draft == 'true'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # Generate this file before checking out the tag. Code from the release
      # source cannot influence the command that creates the build configuration.
      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              build: {
                beforeBuildCommand: { script: "pnpm build", cwd: "ui" }
              },
              // NSIS supports per-user installs without elevation and needs
              // no WiX configuration.
              bundle: { targets: ["nsis"] },
              // Release bundles register only the real scheme. A release
              // binary refuses tidebreak-dev:// links by design.
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Restore unsigned desktop build cache
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
          key: windows-release-desktop-v1-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ needs.validate.outputs.sha }}-${{ needs.validate.outputs.version }}

      - name: Discard restored desktop product binaries
        run: |
          rm -rf \
            target/${{ matrix.target }}/release/tidebreak-desktop.exe \
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*

      # The desktop build script requires target-named sidecars in release
      # mode. The packaging job replaces these inert files with verified
      # sidecars from the parallel preparation job.
      - name: Stage inert sidecars for desktop compilation
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p crates/tidebreak-desktop/binaries
          printf 'MZ' \
            > "crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          printf 'MZ' \
            > "crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@10.18.3
          node -e 'const bin = process.platform === "win32" ? "pnpm.cmd" : "pnpm"; const version = require("node:child_process").execFileSync(bin, ["--version"], { encoding: "utf8", shell: process.platform === "win32" }).trim(); if (version !== "10.18.3") throw new Error("Expected pnpm 10.18.3, got " + version)'
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile desktop without production credentials or bundles
        id: compile
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --no-bundle
            --ci

      - name: Save release-specific unsigned desktop build cache
        if: ${{ !cancelled() && steps.rust-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/.cargo-lock
            target/release/.fingerprint
            target/release/build
            target/release/deps
            target/${{ matrix.target }}/release/.cargo-lock
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/tidebreak-desktop.exe
            target/${{ matrix.target }}/release/tidebreak_desktop_lib.*
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}

      - name: Require successful desktop compilation
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1

      - name: Archive prepared Windows desktop
        env:
          PREPARED_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-desktop
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          PREPARED_ROOT="$(cygpath -u "$PREPARED_ROOT")"
          RELEASE_CONFIG="$(cygpath -u "$RELEASE_CONFIG")"
          workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop.exe"
          for file in "$app_binary" "$RELEASE_CONFIG"; do
            [[ -s "$file" ]] || {
              echo "Prepared Windows desktop input is missing or empty: $file" >&2
              exit 1
            }
          done

          rm -rf "$PREPARED_ROOT"
          mkdir -p "$PREPARED_ROOT/target/$RELEASE_TARGET/release"
          cp -p "$app_binary" "$PREPARED_ROOT/$app_binary"
          cp "$RELEASE_CONFIG" "$PREPARED_ROOT/release-config.json"

          (
            cd "$PREPARED_ROOT"
            sha256sum release-config.json "$app_binary" > SHA256SUMS
          )
          (
            cd "$workspace"
            tar -cf prepared-windows-desktop.tar -C "$PREPARED_ROOT" \
              SHA256SUMS \
              release-config.json \
              target
            sha256sum prepared-windows-desktop.tar \
              > prepared-windows-desktop.tar.sha256
          )

      - name: Upload prepared Windows desktop
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-prepared-windows-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            prepared-windows-desktop.tar
            prepared-windows-desktop.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  build_windows:
    name: Windows · ${{ matrix.arch }}
    needs: [validate, notices, prepare_windows, prepare_windows_desktop]
    if: >-
      ${{
        always()
        && inputs.platforms == 'all'
        && needs.validate.result == 'success'
        && needs.validate.outputs.draft == 'true'
        && needs.notices.result == 'success'
        && needs.prepare_windows.result == 'success'
        && needs.prepare_windows_desktop.result == 'success'
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download prepared Windows sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-windows-sidecars-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-windows-sidecars-download

      - name: Download prepared Windows desktop
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-prepared-windows-desktop-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-windows-desktop-download

      - name: Verify prepared Windows inputs
        env:
          DESKTOP_DOWNLOAD: ${{ runner.temp }}/prepared-windows-desktop-download
          DESKTOP_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-desktop
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
          RELEASE_TARGET: ${{ matrix.target }}
          SIDECARS_DOWNLOAD: ${{ runner.temp }}/prepared-windows-sidecars-download
          SIDECARS_ROOT: ${{ runner.temp }}/tidebreak-prepared-windows-sidecars
        run: |
          DESKTOP_DOWNLOAD="$(cygpath -u "$DESKTOP_DOWNLOAD")"
          DESKTOP_ROOT="$(cygpath -u "$DESKTOP_ROOT")"
          RELEASE_CONFIG="$(cygpath -u "$RELEASE_CONFIG")"
          SIDECARS_DOWNLOAD="$(cygpath -u "$SIDECARS_DOWNLOAD")"
          SIDECARS_ROOT="$(cygpath -u "$SIDECARS_ROOT")"

          rm -rf "$DESKTOP_ROOT" "$SIDECARS_ROOT"
          mkdir -p "$DESKTOP_ROOT" "$SIDECARS_ROOT"
          (
            cd "$DESKTOP_DOWNLOAD"
            sha256sum --check --strict prepared-windows-desktop.tar.sha256
            tar -xf prepared-windows-desktop.tar -C "$DESKTOP_ROOT"
          )
          (
            cd "$DESKTOP_ROOT"
            sha256sum --check --strict SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./release-config.json" \
              "./target/$RELEASE_TARGET/release/tidebreak-desktop.exe" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared Windows desktop archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )
          (
            cd "$SIDECARS_DOWNLOAD"
            sha256sum --check --strict prepared-windows-sidecars.tar.sha256
            tar -xf prepared-windows-sidecars.tar -C "$SIDECARS_ROOT"
          )
          (
            cd "$SIDECARS_ROOT"
            sha256sum --check --strict SHA256SUMS
            expected_files="$(printf '%s\n' \
              "./SHA256SUMS" \
              "./crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe" \
              "./crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe" \
              | LC_ALL=C sort)"
            actual_files="$(find . -type f -print | LC_ALL=C sort)"
            [[ "$actual_files" = "$expected_files" ]] || {
              echo "Prepared Windows sidecar archive contains an unexpected file set" >&2
              printf '%s\n' "$actual_files" >&2
              exit 1
            }
          )

          app_binary="target/$RELEASE_TARGET/release/tidebreak-desktop.exe"
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          mkdir -p "$(dirname "$app_binary")" "$(dirname "$broker_sidecar")"
          cp -p "$DESKTOP_ROOT/$app_binary" "$app_binary"
          cp -p "$SIDECARS_ROOT/$broker_sidecar" "$broker_sidecar"
          cp -p "$SIDECARS_ROOT/$cli_sidecar" "$cli_sidecar"
          cp "$DESKTOP_ROOT/release-config.json" "$RELEASE_CONFIG"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .github/tauri-cli/pnpm-lock.yaml
      - name: Install pinned Tauri bundler
        run: |
          pnpm --dir .github/tauri-cli install --frozen-lockfile --ignore-scripts
          echo "$GITHUB_WORKSPACE/.github/tauri-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate the prepared Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.RELEASE_CONFIG, "utf8"));
            if (config.version !== process.env.TIDEBREAK_VERSION) {
              throw new Error("Prepared version " + config.version + " does not match " + process.env.TIDEBREAK_VERSION);
            }
          '

      # Authenticode code signing is deliberately absent: v1 Windows releases
      # ship unsigned installers. The Tauri updater key still signs the
      # artifact bytes for latest.json — that is artifact authenticity, not
      # Windows code signing.
      - name: Validate updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production updater-signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Bundle the prepared Tauri app without Windows code signing
        working-directory: crates/tidebreak-desktop
        run: |
          tauri bundle \
            --target "${{ matrix.target }}" \
            --config "$RUNNER_TEMP/tidebreak-release.json" \
            --bundles nsis \
            --no-sign \
            --ci

      - name: Verify and collect unsigned artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          target_dir="$(cygpath -u "$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)")"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          setup_paths=("$bundle_dir"/nsis/*-setup.exe)
          (( ${#setup_paths[@]} == 1 )) && [[ -f "${setup_paths[0]}" ]] || {
            echo "Expected exactly one NSIS installer in $bundle_dir/nsis" >&2
            exit 1
          }
          setup_path="${setup_paths[0]}"

          # Tauri copies the target-named sidecar into the installer verbatim;
          # require the executable the bundling step consumed.
          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET.exe"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET.exe"
          [[ -s "$broker_sidecar" ]] || {
            echo "Missing target-named host broker sidecar: $broker_sidecar" >&2
            exit 1
          }
          [[ -s "$cli_sidecar" ]] || {
            echo "Missing target-named CLI sidecar: $cli_sidecar" >&2
            exit 1
          }

          # Windows updates install from the NSIS installer itself, so the
          # updater signature for latest.json covers those exact bytes.
          updater_path="$setup_path"
          signature_path="${updater_path}.sig"
          rm -f "$signature_path"
          tauri signer sign "$updater_path"
          [[ -s "$signature_path" ]] || {
            echo "Tauri updater signature is empty: $signature_path" >&2
            exit 1
          }

          output_dir="dist/windows/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$setup_path" "$output_dir/${base_name}-setup.exe"
          cp "$signature_path" "$output_dir/${base_name}-setup.exe.sig"
          find "$output_dir" -type f -print

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-windows-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/windows/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  build_linux:
    name: Linux · ${{ matrix.arch }}
    needs: [validate, notices]
    if: >-
      ${{
        inputs.platforms == 'all'
        && needs.validate.outputs.draft == 'true'
      }}
    # The x86_64 baseline remains `runs-on: ubuntu-22.04`; the matrix adds the
    # matching native Ubuntu 22.04 ARM runner without changing that baseline.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment:
      name: desktop-production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Install Linux packaging dependencies
        timeout-minutes: 8
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "Release checkout does not match the validated commit." >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$RELEASE_WORKFLOW_SHA"
          installer="$RUNNER_TEMP/tidebreak-install-linux-apt-packages.sh"
          git show "$RELEASE_WORKFLOW_SHA:scripts/install-linux-apt-packages.sh" > "$installer"
          bash "$installer" \
            build-essential \
            cmake \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "Dependency installation changed the release checkout." >&2
            exit 1
          }

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          access: write

      - name: Cache Cargo downloads
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: linux-release-cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"
          cache-bin: false
          cache-targets: false
          save-if: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: crates/tidebreak-desktop/ui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Rust target
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - name: Write tag-derived Tauri configuration
        env:
          RELEASE_CONFIG: ${{ runner.temp }}/tidebreak-release.json
        run: |
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.RELEASE_CONFIG, JSON.stringify({
              version: process.env.TIDEBREAK_VERSION,
              bundle: { targets: ["appimage", "deb"], category: "Productivity" },
              plugins: { "deep-link": { desktop: { schemes: ["tidebreak"] } } }
            }));
          '

      - name: Build the Tauri Linux packages
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: crates/tidebreak-desktop
          args: >-
            --target ${{ matrix.target }}
            --config ${{ runner.temp }}/tidebreak-release.json
            --bundles appimage,deb

      - name: Verify and collect Linux artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing desktop-production updater-signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          target_dir="$(cargo metadata --format-version 1 --no-deps | jq -r .target_directory)"
          bundle_dir="$target_dir/$RELEASE_TARGET/release/bundle"
          appimage_paths=("$bundle_dir"/appimage/*.AppImage)
          deb_paths=("$bundle_dir"/deb/*.deb)
          (( ${#appimage_paths[@]} == 1 )) && [[ -f "${appimage_paths[0]}" ]] || {
            echo "Expected exactly one AppImage in $bundle_dir/appimage" >&2
            exit 1
          }
          (( ${#deb_paths[@]} == 1 )) && [[ -f "${deb_paths[0]}" ]] || {
            echo "Expected exactly one Debian package in $bundle_dir/deb" >&2
            exit 1
          }
          appimage_path="${appimage_paths[0]}"
          deb_path="${deb_paths[0]}"

          broker_sidecar="crates/tidebreak-desktop/binaries/tidebreak-host-broker-$RELEASE_TARGET"
          cli_sidecar="crates/tidebreak-desktop/binaries/tidebreak-$RELEASE_TARGET"
          [[ -x "$broker_sidecar" ]] || {
            echo "Missing executable target-named host broker sidecar: $broker_sidecar" >&2
            exit 1
          }
          [[ -x "$cli_sidecar" ]] || {
            echo "Missing executable target-named CLI sidecar: $cli_sidecar" >&2
            exit 1
          }

          appimage_signature_path="${appimage_path}.sig"
          rm -f "$appimage_signature_path"
          tauri signer sign "$appimage_path"
          [[ -s "$appimage_signature_path" ]] || {
            echo "Tauri updater signature is empty: $appimage_signature_path" >&2
            exit 1
          }

          deb_signature_path="${deb_path}.sig"
          rm -f "$deb_signature_path"
          tauri signer sign "$deb_path"
          [[ -s "$deb_signature_path" ]] || {
            echo "Tauri updater signature is empty: $deb_signature_path" >&2
            exit 1
          }

          output_dir="dist/linux/$RELEASE_ARCH"
          base_name="Tidebreak_${TIDEBREAK_VERSION}_${RELEASE_ARCH}"
          mkdir -p "$output_dir"
          cp "$appimage_path" "$output_dir/${base_name}.AppImage"
          cp "$appimage_signature_path" "$output_dir/${base_name}.AppImage.sig"
          cp "$deb_path" "$output_dir/${base_name}.deb"
          cp "$deb_signature_path" "$output_dir/${base_name}.deb.sig"
          find "$output_dir" -type f -print

      - name: Upload verified Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-linux-${{ matrix.arch }}-${{ needs.validate.outputs.version }}
          path: dist/linux/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  source_sbom:
    name: generate source SBOM
    needs: validate
    if: ${{ needs.validate.outputs.draft == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: release-source
          persist-credentials: false

      - name: Create the source SBOM output directory
        run: mkdir -p source-sbom

      - name: Generate the source-scoped release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-source
          format: spdx-json
          output-file: source-sbom/Tidebreak_${{ needs.validate.outputs.version }}_source.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum the source-scoped release SBOM
        env:
          TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sbom="source-sbom/Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          sbom_name="${sbom#source-sbom/}"
          sbom_digest="$(sha256sum "$sbom" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$sbom_digest" "$sbom_name" > "$sbom.sha256"

      - name: Upload the checksummed source SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tidebreak-source-sbom-${{ needs.validate.outputs.version }}
          path: source-sbom/
          if-no-files-found: error
          retention-days: 7

  attach_downloads:
    name: prepare GitHub release downloads
    needs: [validate, build_macos, build_windows, build_linux, source_sbom]
    # A published release already owns immutable assets. A draft instead needs
    # the fresh package build and SBOM before those assets can be attached.
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && (
          needs.validate.outputs.draft != 'true'
          || (
            needs.build_macos.result == 'success'
            && (
              needs.build_windows.result == 'success'
              || (inputs.platforms != 'all' && needs.build_windows.result == 'skipped')
            )
            && (
              needs.build_linux.result == 'success'
              || (inputs.platforms != 'all' && needs.build_linux.result == 'skipped')
            )
            && needs.source_sbom.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      # The provenance attestation needs an OIDC token and its own grant.
      attestations: write
      contents: write
      id-token: write
    env:
      TIDEBREAK_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      RELEASE_PLATFORMS: ${{ inputs.platforms || 'macos' }}
      # GitHub Releases is the only download host. The manifests and the
      # updater feed point here; create-release-manifests.mjs refuses any
      # other base URL.
      RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified macOS build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-macos-universal-${{ needs.validate.outputs.version }}
          path: dist/macos/universal

      - name: Download the verified x86_64 Windows build
        if: ${{ inputs.platforms == 'all' && needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-x86_64-${{ needs.validate.outputs.version }}
          path: dist/windows/x86_64

      - name: Download the verified ARM64 Windows build
        if: ${{ inputs.platforms == 'all' && needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-windows-aarch64-${{ needs.validate.outputs.version }}
          path: dist/windows/aarch64

      - name: Download the verified x86_64 Linux build
        if: ${{ inputs.platforms == 'all' && needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-x86_64-${{ needs.validate.outputs.version }}
          path: dist/linux/x86_64

      - name: Download the verified ARM64 Linux build
        if: ${{ inputs.platforms == 'all' && needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-linux-aarch64-${{ needs.validate.outputs.version }}
          path: dist/linux/aarch64

      - name: Download the checksummed source SBOM
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-source-sbom-${{ needs.validate.outputs.version }}
          path: dist

      # GitHub's /releases/latest/ redirect serves whichever published release
      # is newest, so publishing an older version would roll every installed
      # app's updater feed back.
      - name: Prevent latest-version regression
        if: ${{ needs.validate.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -z "$current" ]]; then
            echo "No Tidebreak release is published yet."
            exit 0
          fi
          node scripts/check-release-order.mjs "${current#v}" "$TIDEBREAK_VERSION"

      - name: Create release manifests and checksums
        if: ${{ needs.validate.outputs.draft == 'true' }}
        run: >-
          node scripts/create-release-manifests.mjs
          --dist dist
          --version "$TIDEBREAK_VERSION"
          --tag "$RELEASE_TAG"
          --sha "$RELEASE_SHA"
          --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          --base-url "$RELEASE_BASE_URL"
          --platforms "$RELEASE_PLATFORMS"

      # Every versioned package, signature, and checksum becomes a release
      # asset under its own name, beside manifest.json and latest.json. The
      # version-free copies give the README permanent one-click download links
      # through GitHub's /releases/latest/download/ redirect.
      - name: Prepare downloads from the verified build
        if: ${{ needs.validate.outputs.draft == 'true' }}
        run: |
          mkdir -p downloads
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            [[ ! -e "downloads/$name" ]] || {
              echo "Two release files share the asset name $name." >&2
              exit 1
            }
            cp "$file" "downloads/$name"
          done < <(find dist -type f -print0)
          for name in manifest.json latest.json; do
            (cd downloads && sha256sum "$name" > "$name.sha256")
          done
          sbom="Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          (cd downloads && sha256sum --check --strict "$sbom.sha256")

          base="Tidebreak_${TIDEBREAK_VERSION}_universal"
          for suffix in dmg app.zip app.tar.gz app.tar.gz.sig; do
            [[ -f "downloads/$base.$suffix" ]] || {
              echo "The verified build did not contain $base.$suffix." >&2
              exit 1
            }
          done
          cp "downloads/$base.dmg" downloads/Tidebreak-macos-universal.dmg
          (cd downloads && sha256sum Tidebreak-macos-universal.dmg \
            > Tidebreak-macos-universal.dmg.sha256)

          if [[ "$RELEASE_PLATFORMS" == all ]]; then
            for arch in x86_64 aarch64; do
              versioned="Tidebreak_${TIDEBREAK_VERSION}_${arch}"
              for file in \
                "$versioned-setup.exe" \
                "$versioned-setup.exe.sig" \
                "$versioned.AppImage" \
                "$versioned.AppImage.sig" \
                "$versioned.deb" \
                "$versioned.deb.sig"; do
                [[ -f "downloads/$file" ]] || {
                  echo "The verified $arch build did not contain $file." >&2
                  exit 1
                }
              done
              cp "downloads/$versioned-setup.exe" \
                "downloads/Tidebreak-windows-${arch}-setup.exe"
              cp "downloads/$versioned.AppImage" \
                "downloads/Tidebreak-linux-${arch}.AppImage"
              cp "downloads/$versioned.deb" \
                "downloads/Tidebreak-linux-${arch}.deb"
              for name in \
                "Tidebreak-windows-${arch}-setup.exe" \
                "Tidebreak-linux-${arch}.AppImage" \
                "Tidebreak-linux-${arch}.deb"; do
                (cd downloads && sha256sum "$name" > "$name.sha256")
              done
            done
          fi

      # While Windows and Linux packaging is paused, the README's permanent
      # /releases/latest/download/ links keep serving the last builds that
      # shipped: the stable-name installers and their checksum sidecars are
      # copied unchanged from the previous published release. Versioned
      # packages and updater signatures are not carried, so `latest.json`
      # advertises no Windows or Linux update and installed apps stay put.
      # A repository with no earlier release, or one whose latest release
      # never carried them, has nothing to carry.
      - name: Carry forward the paused Windows and Linux downloads
        if: >-
          ${{
            inputs.platforms != 'all'
            && needs.validate.outputs.draft == 'true'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -z "$previous" ]]; then
            echo "::warning::No release is published yet, so this release ships macOS downloads only."
            exit 0
          fi
          [[ "$previous" != "$RELEASE_TAG" ]] || {
            echo "The draft $RELEASE_TAG is already the latest published release." >&2
            exit 1
          }
          names=(
            Tidebreak-windows-x86_64-setup.exe
            Tidebreak-windows-aarch64-setup.exe
            Tidebreak-linux-x86_64.AppImage
            Tidebreak-linux-x86_64.deb
            Tidebreak-linux-aarch64.AppImage
            Tidebreak-linux-aarch64.deb
          )
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous" --jq '[.assets[].name]')"
          carried=0
          for name in "${names[@]}"; do
            if jq -e --arg name "$name" 'any(.[]; . == $name)' <<<"$assets" >/dev/null; then
              carried=$((carried + 1))
            fi
          done
          if (( carried == 0 )); then
            echo "::warning::Release $previous carries no Windows or Linux downloads, so this release ships macOS downloads only."
            exit 0
          fi
          echo "Carrying Windows and Linux downloads forward from $previous."
          for name in "${names[@]}"; do
            gh release download "$previous" \
              --repo "$GITHUB_REPOSITORY" \
              --dir downloads \
              --pattern "$name" \
              --pattern "$name.sha256"
            [[ -f "downloads/$name" && -f "downloads/$name.sha256" ]] || {
              echo "Release $previous does not carry $name and its checksum." >&2
              exit 1
            }
          done

      - name: Download existing immutable GitHub assets
        if: ${{ needs.validate.outputs.draft != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir downloads

      - name: Verify the complete GitHub asset set
        run: |
          universal_dmg="downloads/Tidebreak-macos-universal.dmg"
          compatibility_dmg="downloads/Tidebreak-macos-apple-silicon.dmg"
          [[ -f "$universal_dmg" ]] || {
            echo "The universal macOS disk image was not prepared." >&2
            exit 1
          }
          if [[ ! -f "$compatibility_dmg" ]]; then
            cp "$universal_dmg" "$compatibility_dmg"
            (cd downloads && sha256sum "$(basename "$compatibility_dmg")" \
              > "$(basename "$compatibility_dmg").sha256")
          fi

          # The version-free Windows and Linux downloads travel together: all
          # six, or none while their packaging is paused.
          cross_platform=(
            Tidebreak-windows-x86_64-setup.exe
            Tidebreak-windows-aarch64-setup.exe
            Tidebreak-linux-x86_64.AppImage
            Tidebreak-linux-x86_64.deb
            Tidebreak-linux-aarch64.AppImage
            Tidebreak-linux-aarch64.deb
          )
          present=0
          for name in "${cross_platform[@]}"; do
            [[ ! -f "downloads/$name" ]] || present=$((present + 1))
          done
          if [[ "$RELEASE_PLATFORMS" == all ]] || (( present > 0 )); then
            for name in "${cross_platform[@]}"; do
              [[ -f "downloads/$name" ]] || {
                echo "The cross-platform download was not prepared: $name" >&2
                exit 1
              }
            done
          fi

          while IFS= read -r -d '' file; do
            case "$file" in
              *.sha256) continue ;;
            esac
            [[ -f "$file.sha256" ]] || {
              echo "Release asset has no checksum sidecar: ${file#downloads/}" >&2
              exit 1
            }
          done < <(find downloads -type f -print0)
          while IFS= read -r -d '' checksum; do
            (cd downloads && sha256sum --check --strict "${checksum#downloads/}")
          done < <(find downloads -name '*.sha256' -type f -print0)

          # The feed must be exactly what the manifest describes, and every
          # file the manifest names must ship with the release.
          node scripts/prepare-published-release.mjs \
            --manifest downloads/manifest.json \
            --latest "$RUNNER_TEMP/expected-latest.json" \
            --version "$TIDEBREAK_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --published-at "$(jq -er .published_at downloads/manifest.json)" \
            --base-url "$RELEASE_BASE_URL" \
            --platforms "$RELEASE_PLATFORMS" >/dev/null
          cmp "$RUNNER_TEMP/expected-latest.json" downloads/latest.json
          while IFS= read -r name; do
            [[ -f "downloads/$name" ]] || {
              echo "The release manifest names a file the release does not carry: $name" >&2
              exit 1
            }
          done < <(jq -r '.artifacts[]
            | .filename,
              .checksum_filename,
              (.signature_filename // empty),
              (.signature_filename // empty | . + ".sha256")' \
            downloads/manifest.json)
          sbom="Tidebreak_${TIDEBREAK_VERSION}_source.spdx.json"
          [[ -f "downloads/$sbom" ]] || {
            echo "The release does not carry its source SBOM: $sbom" >&2
            exit 1
          }

      # Attest only what this run built: the packages, signatures, checksums,
      # manifests, and SBOM under dist. Version-free copies share their bytes
      # with a versioned file, and carried-forward downloads keep the
      # attestation of the release that built them.
      - name: Prepare provenance attestation subjects
        if: ${{ needs.validate.outputs.draft == 'true' }}
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) \
            > "$RUNNER_TEMP/immutable-release-files.sha256"

      # GitHub artifact attestations are free for public repositories, and a
      # public release fails closed if its provenance cannot be recorded.
      # Private repositories need Enterprise Cloud for them, so a private
      # copy of this repository skips the step.
      - name: Attest immutable release provenance
        if: >-
          ${{
            needs.validate.outputs.draft == 'true'
            && github.event.repository.visibility == 'public'
          }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/immutable-release-files.sha256

      # Assets are attached while the release is still a draft; immutable
      # releases cannot be changed after the final publication step below.
      - name: Attach or verify the GitHub Release downloads
        env:
          RELEASE_DRAFT: ${{ needs.validate.outputs.draft }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_DRAFT" = true ]]; then
            # Retry one file at a time so a transient failure does not restart
            # successful uploads. --clobber replaces any incomplete asset.
            for file in downloads/*; do
              uploaded=false
              for attempt in 1 2 3 4; do
                echo "Uploading ${file##*/} (attempt $attempt/4)."
                # A stalled HTTP transfer must return control to the retry loop.
                if timeout --kill-after=15s 300s \
                  gh release upload "$RELEASE_TAG" "$file" \
                  --repo "$GITHUB_REPOSITORY" --clobber; then
                  uploaded=true
                  break
                fi
                if [[ "$attempt" -lt 4 ]]; then
                  echo "Upload failed for ${file##*/}; retrying (attempt $((attempt + 1))/4)." >&2
                  sleep "$((attempt * 5))"
                fi
              done
              if [[ "$uploaded" != true ]]; then
                echo "Upload failed for ${file##*/} after four attempts." >&2
                exit 1
              fi
            done
          fi

          find downloads -type f -exec basename {} \; | sort \
            > "$RUNNER_TEMP/expected-release-assets"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.state == "uploaded") | .name' | sort > "$RUNNER_TEMP/actual-release-assets"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets" \
            "$RUNNER_TEMP/actual-release-assets"

  finalize_release:
    name: publish immutable GitHub Release
    needs: [validate, build_macos, attach_downloads]
    if: >-
      ${{
        always()
        && needs.validate.result == 'success'
        && needs.attach_downloads.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
    steps:
      - name: Download the frozen release metadata
        if: ${{ needs.validate.outputs.draft == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tidebreak-release-${{ needs.validate.outputs.release_id }}-snapshot
          path: ${{ runner.temp }}/release-snapshot

      - name: Publish or validate the immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING: ${{ needs.build_macos.outputs.signing }}
          RELEASE_DRAFT: ${{ needs.validate.outputs.draft }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" \
            --jq .sha)"
          [[ "$tag_sha" = "$RELEASE_SHA" ]] || {
            echo "Release tag $RELEASE_TAG moved after validation." >&2
            exit 1
          }

          if [[ "$RELEASE_DRAFT" = true ]]; then
            snapshot="$RUNNER_TEMP/release-snapshot/release-snapshot.json"
            # Without Apple signing the macOS build is ad-hoc signed, and
            # people need to know how to open it before they download it.
            note=""
            if [[ "$MACOS_SIGNING" = adhoc ]]; then
              note="$(cat <<'NOTE'
          ## Opening the macOS build

          This macOS build is ad-hoc signed and not notarized by Apple, so macOS blocks it the first time you open it. To open it, choose **Open Anyway** in System Settings > Privacy & Security, or run `xattr -dr com.apple.quarantine /Applications/Tidebreak.app` in Terminal. macOS may ask you to grant Accessibility and Screen Recording again after each update.
          NOTE
              )"
            elif [[ "$MACOS_SIGNING" != developer-id ]]; then
              echo "The macOS build reported no signing mode." >&2
              exit 1
            fi
            jq --arg note "$note" \
              '. + {draft: false, prerelease: false, make_latest: "true"}
                | if $note == "" then .
                  else .body = ((.body // "" | sub("\\s+$"; "")) + "\n\n" + $note + "\n")
                  end' "$snapshot" | gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input - >/dev/null
          fi

          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$(jq -r .tag_name <<<"$release_json")" = "$RELEASE_TAG" ]] || {
            echo "GitHub published a release for the wrong tag." >&2
            exit 1
          }
          [[ "$(jq -r .draft <<<"$release_json")" = false ]] || {
            echo "GitHub Release $RELEASE_TAG is still a draft." >&2
            exit 1
          }
          [[ "$(jq -r .prerelease <<<"$release_json")" = false ]] || {
            echo "GitHub Release $RELEASE_TAG unexpectedly became a prerelease." >&2
            exit 1
          }
          published_at="$(jq -er \
            '.published_at | select(type == "string" and length > 0)' \
            <<<"$release_json")"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
      - name: Publish the server image for this release
        if: ${{ needs.validate.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # publish-server-image.yml declares `on: release: [published]`, but
          # that trigger cannot fire for a release this job publishes: the
          # PATCH above runs on GITHUB_TOKEN, and GitHub does not start a
          # workflow run from an event that token created. workflow_dispatch is
          # one of the two exceptions to that rule, so dispatch it explicitly.
          # The release trigger stays declared for a release someone publishes
          # by hand in the UI, which carries a user token and does fire.
          gh workflow run publish-server-image.yml \
            --repo "$GITHUB_REPOSITORY" --ref main --field "release_tag=$RELEASE_TAG"

      - name: Refresh the next release draft
        if: ${{ needs.validate.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start a new draft immediately after publishing. If any PRs merged
          # during the build, Release Drafter already created one while the
          # release was a prerelease; this call is idempotent and just ensures
          # a draft exists even when the build was quiet.
          gh workflow run release-draft.yml --repo "$GITHUB_REPOSITORY" --ref main --field update-draft=true
