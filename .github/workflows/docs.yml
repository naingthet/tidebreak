name: Publish documentation

# Builds the static docs-site export and deploys it to GitHub Pages, where it
# lives at https://naingthet.github.io/tidebreak/docs/. GitHub Pages is free
# for public repositories. Set the repository's Pages source to "GitHub
# Actions" once; the deploy job below does the rest.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment already running finishes, so the site
# is never left half-updated, and a newer push waits for it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build documentation
    # The github-pages environment accepts deployments from the default
    # branch only, so a manual run from another branch stops here.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The site's own routes start at its root. Pages serves this repository
      # under /tidebreak/, and the docs sit one level below that.
      BASE_PATH: /tidebreak/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked documentation dependencies
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: Build and check the static documentation
        run: |
          pnpm --dir docs-site build
          pnpm --dir docs-site lint
          pnpm --dir docs-site types:check
          test -f docs-site/out/index.html
          test -f docs-site/out/quickstart/index.html
          test -f docs-site/out/search-index.json
          test -f docs-site/out/sitemap.xml
          # Assets and links must resolve under the Pages path, and canonical
          # metadata must name the public URL.
          grep -Fq '/tidebreak/docs/_next/' docs-site/out/index.html
          grep -Fq 'https://naingthet.github.io/tidebreak/docs/' docs-site/out/index.html
      - name: Stage the site for GitHub Pages
        run: |
          mkdir -p _site/docs
          cp -R docs-site/out/. _site/docs/
          # The repository's Pages root has no page of its own, so it sends
          # visitors on to the documentation.
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>Tidebreak documentation</title>
          <meta http-equiv="refresh" content="0; url=docs/">
          <link rel="canonical" href="https://naingthet.github.io/tidebreak/docs/">
          <p><a href="docs/">Tidebreak documentation</a></p>
          </html>
          EOF
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploying to Pages needs an OIDC token and the pages grant, and nothing
    # else in this workflow does.
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
